<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="description" content="DelicateDuck582 的主页没有链接，只有命令：按 ⌘K，指挥一切。">
<title>指挥台 | DelicateDuck582</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  @font-face {
    font-family: "Inter var";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("inter-var.woff2") format("woff2");
  }
  :root {
    --bg: #101010;
    --panel: #171717;
    --fg: #ededed;
    --muted: #9b9b9b;
    --faint: #666;
    --line: rgba(237, 237, 237, 0.09);
    --accent: #cc785c;
    --accent-soft: rgba(204, 120, 92, 0.16);
    --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;
    --sans: "Inter var", "Inter", -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC",
            "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  [data-theme="light"] {
    --bg: #f4f1ea;
    --panel: #fbf8f2;
    --fg: #1d1a15;
    --muted: #6f695e;
    --faint: #a29a8b;
    --line: rgba(29, 26, 21, 0.10);
    --accent: #b3542f;
    --accent-soft: rgba(179, 84, 47, 0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    font-size: 15px; line-height: 1.7;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  ::selection { background: var(--accent-soft); }
  a { color: inherit; text-decoration: none; }
  kbd {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 7px; line-height: 1.4;
    transition: background-color .3s, color .3s, border-color .3s;
  }

  /* ---------- 应用壳 ---------- */
  .shell {
    height: 100dvh; display: flex; flex-direction: column;
    transition: transform .38s cubic-bezier(.4, 0, 1, 1), opacity .38s cubic-bezier(.4, 0, 1, 1);
  }
  .topbar {
    flex: none; display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 20px;
    border-bottom: 1px solid var(--line);
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .topbar .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  .topbar .brand { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
  .topbar .env { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .08em; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .topbar .clock { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .topbar .kbd-open { cursor: pointer; display: inline-flex; gap: 4px; }
  .topbar .kbd-open kbd { cursor: pointer; }

  /* 舞台：内容面板 */
  .stage {
    flex: 1; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
    position: relative;
  }
  .stage::before {
    content: "⌘K"; position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 800;
    font-size: min(34vw, 300px); letter-spacing: -0.04em;
    color: transparent; -webkit-text-stroke: 1.5px var(--line);
    pointer-events: none; user-select: none;
    transition: opacity .4s ease;
  }
  .stage.busy::before { opacity: 0; }
  .view { max-width: 560px; width: 100%; }
  .view.leaving { opacity: 0; transform: translateY(10px) scale(.99); transition: opacity .17s ease, transform .17s ease; }
  .view > * { animation: vfade .45s var(--ease) both; }
  .view > *:nth-child(1) { animation-delay: .02s; }
  .view > *:nth-child(2) { animation-delay: .08s; }
  .view > *:nth-child(3) { animation-delay: .14s; }
  .view > *:nth-child(4) { animation-delay: .2s; }
  .view > *:nth-child(5) { animation-delay: .26s; }
  @keyframes vfade { from { opacity: 0; transform: translateY(10px); } }
  /* 日志视图的行顺次浮现 */
  .view .row { animation: rowin .5s var(--ease) both; }
  @keyframes rowin { from { opacity: 0; transform: translateX(14px); } }

  /* ---------- worklog 全屏浮层 ---------- */
  .worklog-veil {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(6, 6, 6, 0.55);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .worklog-veil.on { opacity: 1; pointer-events: auto; }
  .worklog {
    position: fixed; inset: 0; z-index: 61;
    height: 100dvh;
    display: grid; grid-template-rows: auto 1fr;
    background: var(--bg);
    opacity: 0; pointer-events: none;
    transform: scale(.975) translateY(10px);
    transition: opacity .38s cubic-bezier(.4, 0, 1, 1),
                transform .38s cubic-bezier(.4, 0, 1, 1),
                background-color .3s, border-color .3s;
  }
  .worklog[hidden], .worklog-veil[hidden] { display: none; }
  .wlopen .worklog {
    opacity: 1; pointer-events: auto; transform: none;
    transition: opacity .44s var(--ease), transform .44s var(--ease),
                background-color .3s, border-color .3s;
  }
  .wlopen .shell {
    transform: scale(.96); opacity: .45;
    transition: transform .44s var(--ease), opacity .44s var(--ease);
  }
  .wl-bar {
    display: flex; align-items: center; gap: 10px;
    height: 50px; padding: 0 10px 0 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .wl-bar b { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
  .wl-hint { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .06em; }
  .wl-pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); opacity: .8;
    animation: wlpulse 1.2s ease-in-out infinite;
    transition: opacity .3s ease;
  }
  .worklog.loaded .wl-pulse { opacity: 0; animation: none; }
  @keyframes wlpulse { 50% { opacity: .25; } }
  .wl-x {
    margin-left: auto; width: 40px; height: 40px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); cursor: pointer;
    font: inherit; font-size: 15px; line-height: 1;
    transition: color .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .wl-x:hover { color: var(--fg); border-color: rgba(204, 120, 92, .5); background: var(--accent-soft); }
  .wl-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wl-x:active { transform: scale(.96); }
  .wl-body { position: relative; min-height: 0; overflow: hidden; background: var(--bg); }
  .wl-body iframe {
    position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
    border: 0; background: var(--bg);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .wl-body iframe.ready { opacity: 1; pointer-events: auto; }
  .wl-skeleton {
    position: absolute; inset: 0; z-index: 0;
    display: flex; flex-direction: column; gap: 14px;
    padding: 34px 28px;
    background: var(--bg);
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .wl-skeleton.gone { opacity: 0; }
  .wl-skeleton span {
    display: block; height: 14px; border-radius: 6px; opacity: .85;
    background-color: var(--panel);
    background-image: linear-gradient(100deg, transparent 25%, var(--line) 50%, transparent 75%);
    background-size: 220% 100%;
    animation: shimmer 1.2s linear infinite;
  }
  .wl-skeleton span:nth-child(1) { width: 68%; }
  .wl-skeleton span:nth-child(2) { width: 92%; }
  .wl-skeleton span:nth-child(3) { width: 61%; }
  .wl-skeleton span:nth-child(4) { width: 81%; }
  @keyframes shimmer { from { background-position: 180% 0; } to { background-position: -80% 0; } }
  .view .kick { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--accent); }
  .view h1 {
    margin-top: 14px;
    font-size: clamp(30px, 5vw, 46px); font-weight: 750; letter-spacing: -0.02em; line-height: 1.25;
  }
  .view h1 kbd { font-size: .55em; vertical-align: .12em; }
  .view h1 em { font-style: normal; color: var(--accent); }
  .view .sub { margin-top: 16px; color: var(--muted); font-size: 14.5px; max-width: 30em; }
  .view .sub b { color: var(--fg); font-weight: 600; }
  .view .sub .wl-link {
    border: 0; background: none; padding: 0; margin: 0;
    font: inherit; color: var(--accent); cursor: pointer;
    transition: color .2s ease;
  }
  .view .sub .wl-link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .view .sub .wl-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .view .hintkeys { margin-top: 34px; display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12.5px; flex-wrap: wrap; }

  .mono-block {
    margin-top: 18px; font-family: var(--mono); font-size: 13px; line-height: 2.1;
    color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px;
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .mono-block b { color: var(--accent); font-weight: 500; }
  .mono-block .w { color: var(--fg); }

  .rows {
    margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .row {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel);
    transition: background-color .15s ease, color .3s ease, border-color .3s ease;
  }
  .row:last-child { border-bottom: 0; }
  a.row:hover, button.row:hover { background: var(--accent-soft); }
  button.row {
    width: 100%; border: 0; border-bottom: 1px solid var(--line);
    font: inherit; text-align: left; color: inherit; cursor: pointer;
  }
  button.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .t { font-weight: 600; font-size: 14.5px; }
  .row .d { color: var(--muted); font-size: 12.5px; }
  .row .u { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .06em; white-space: nowrap; }

  .statusline {
    position: fixed; left: 20px; bottom: 14px;
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .08em;
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .statusline b { color: var(--accent); font-weight: 500; }
  .cmd-open-mobile {
    position: fixed; right: 18px; bottom: 14px; z-index: 30;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    font: inherit; font-size: 12.5px; padding: 9px 16px; border-radius: 10px;
    cursor: pointer; display: none; align-items: center; gap: 8px;
    transition: background-color .3s, color .3s, border-color .3s;
  }

  /* ---------- 命令面板 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 8, 8, 0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 14vh 20px 20px;
  }
  [data-theme="light"] .overlay { background: rgba(60, 50, 40, 0.25); }
  .overlay.on { display: flex; animation: fadein .15s ease; }
  .overlay.closing { display: flex; animation: fadeout .16s ease-in both; }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; } }
  .palette {
    width: 100%; max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
    overflow: hidden;
    animation: pop .22s var(--ease);
    transition: background-color .3s, color .3s, border-color .3s;
  }
  .overlay.closing .palette { animation: popout .16s ease-in both; }
  @keyframes pop { from { opacity: 0; transform: scale(.98) translateY(-6px); } }
  @keyframes popout { to { opacity: 0; transform: translateY(6px) scale(.985); } }
  .palette .search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .palette .search .mag { color: var(--faint); font-size: 14px; }
  .palette input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--fg);
    caret-color: var(--accent);
  }
  .palette input::placeholder { color: var(--faint); }
  .palette .esc kbd { font-size: 10px; }
  .palette .list { max-height: 320px; overflow: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .palette .list::-webkit-scrollbar { width: 6px; }
  .palette .list::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
  .palette .list::-webkit-scrollbar-track { background: transparent; }
  .palette .group { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--faint); padding: 10px 12px 4px; }
  .cmd {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 9px; cursor: pointer;
    color: var(--muted); font-size: 14px;
    transition: background-color .12s ease, color .12s ease;
    animation: fadein .26s var(--ease) both;
    animation-delay: var(--cin, 0ms);
  }
  .cmd .ic { width: 20px; text-align: center; color: var(--faint); flex: none; }
  .cmd mark { background: none; color: var(--fg); font-weight: 650; }
  .cmd .kbdhint { margin-left: auto; opacity: 0; }
  .cmd.sel { background: var(--accent-soft); color: var(--fg); }
  .cmd.sel .ic { color: var(--accent); }
  .cmd.sel .kbdhint { opacity: 1; }
  .palette .foot {
    display: flex; gap: 16px; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--faint);
  }
  .palette .foot .r { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; }
  .palette .empty { padding: 26px 16px; text-align: center; color: var(--faint); font-size: 13.5px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(8px);
    z-index: 80; background: var(--accent); color: #14100d;
    font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .3s var(--ease);
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }

  /* ---------- Ciallo 彩蛋浮层 ---------- */
  .ciallo {
    position: fixed; inset: 0; z-index: 62;
    display: grid; place-items: center;
    padding: 20px;
    background: rgba(6, 6, 6, 0.6);
    opacity: 0;
    transition: opacity .22s ease-in;
  }
  [data-theme="light"] .ciallo { background: rgba(60, 50, 40, 0.3); }
  .ciallo[hidden] { display: none; }
  .ciallo.on { opacity: 1; transition: opacity .38s var(--ease); }
  .ciallo-card {
    max-width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 22px 24px 18px;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 40px 90px rgba(0, 0, 0, .5);
    opacity: 0; transform: scale(.92);
    transition: opacity .22s ease-in, transform .22s ease-in;
  }
  .ciallo.on .ciallo-card {
    opacity: 1; transform: none;
    transition: opacity .38s var(--ease), transform .38s var(--ease);
  }
  .ciallo-card img {
    display: block; width: min(320px, 78vw); max-width: 100%; height: auto;
    border-radius: 10px;
  }
  .ciallo-card img[hidden] { display: none; }
  .ciallo-text { font-family: var(--mono); font-size: 14px; color: var(--accent); line-height: 1.4; }
  .ciallo-hint { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .08em; }

  /* 主题切换只在这段时间内启用颜色过渡 */
  .theming * {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  @media (max-width: 640px) {
    .topbar .env, .topbar .clock { display: none; }
    .stage { padding: 24px 18px; align-items: flex-start; padding-top: 12vh; }
    .cmd-open-mobile { display: inline-flex; }
    .overlay { padding: 10vh 12px 12px; }
    .palette .list { max-height: 46vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    .wl-skeleton span { animation: none; }
    .wl-pulse { animation: none; }
    .cmd { animation: none; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="shell">
    <header class="topbar">
      <span class="dot"></span>
      <span class="brand">DelicateDuck582</span>
      <span class="env">COMMAND · v582</span>
      <span class="right">
        <span class="clock" id="clock">--:--</span>
        <span class="kbd-open" id="kbdopen" title="打开命令面板"><kbd>⌘</kbd><kbd>K</kbd></span>
      </span>
    </header>

    <main class="stage" id="stage"><div class="view" id="view"></div></main>

    <p class="statusline">STATUS <b>●</b> OPERATIONAL · ciallo.sale · 无人能规定你该做什么</p>
    <button class="cmd-open-mobile" id="mobileopen">⌘K 命令</button>
  </div>

  <!-- 命令面板 -->
  <div class="overlay" id="overlay">
    <div class="palette" role="dialog" aria-label="命令面板">
      <div class="search">
        <span class="mag">⌕</span>
        <input id="q" type="text" placeholder="输入命令或搜索……" autocomplete="off" spellcheck="false">
        <span class="esc"><kbd>esc</kbd></span>
      </div>
      <div class="list" id="list"></div>
      <div class="foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 执行</span>
        <span class="r">DUCK CMD v582</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Ciallo 彩蛋 -->
  <section class="ciallo" id="ciallo" role="dialog" aria-modal="true" aria-label="Ciallo" aria-hidden="true" hidden>
    <div class="ciallo-card">
      <img src="ciallo.avif" alt="Ciallo～(∠・ω&lt; )⌒★" onerror="this.hidden = true">
      <p class="ciallo-text">Ciallo～(∠・ω&lt; )⌒★</p>
      <p class="ciallo-hint">点击任意处 / esc 关闭</p>
    </div>
  </section>

  <!-- worklog 全屏浮层 -->
  <div class="worklog-veil" id="veil" hidden></div>
  <section class="worklog" id="worklog" role="dialog" aria-modal="true" aria-label="工作日志" aria-hidden="true" hidden>
    <div class="wl-bar">
      <b>工作日志</b>
      <span class="wl-hint">esc 关闭</span>
      <span class="wl-pulse" aria-hidden="true"></span>
      <button class="wl-x" id="dclose" aria-label="关闭工作日志" title="关闭（esc）">✕</button>
    </div>
    <div class="wl-body">
      <iframe id="dframe" title="工作日志" loading="lazy"></iframe>
      <div class="wl-skeleton" id="dskeleton" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </section>

<script>
(function () {
  'use strict';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 视图 ---------- */
  var VIEWS = {
    home: '<p class="kick">COMMAND · 指挥台</p>' +
          '<h1>按 <kbd>⌘K</kbd>，<br>指挥<em>一切</em>。</h1>' +
          '<p class="sub">我是 <b>DelicateDuck582</b>，学生党 · 纯 AI 开发者。这个主页没有一个可以点的东西——只有一个命令面板。<b>随便敲个键</b>试试。</p>' +
          '<p class="hintkeys">或者 <kbd>↑</kbd><kbd>↓</kbd> 翻命令 · <kbd>↵</kbd> 执行 · 敲 <b>G</b> 去项目 · 敲 <b>C</b> 去联络</p>',
    about: '<p class="kick">PAGE · 关于</p>' +
           '<h1>先跑通，<br>再见人。</h1>' +

  var viewEl = document.getElementById('view');
  var stage = document.getElementById('stage');
  var currentView = '', viewTimer = null;
  function show(name) {
    if (name === currentView) return;
    currentView = name;
    clearTimeout(viewTimer);
    viewEl.classList.remove('leaving');
    function enter() {
      stage.classList.add('busy');
      viewEl.innerHTML = VIEWS[name];
      requestAnimationFrame(function () { requestAnimationFrame(function () { stage.classList.remove('busy'); }); });
    }
    if (!viewEl.firstElementChild || reduced) { enter(); return; }
    viewEl.classList.add('leaving');
    viewTimer = setTimeout(function () {
      viewEl.classList.remove('leaving');
      enter();
    }, 170);
  }
  show('home');

  /* 日志视图入口：事件委托，适配 innerHTML 动态渲染 */
  viewEl.addEventListener('click', function (e) {
    var trigger = e.target.closest('.wl-link, .wl-row');
    if (!trigger) return;
    e.preventDefault();
    openDrawer();
  });

  var themeTimer = null;
  var metaTheme = document.querySelector('meta[name="theme-color"]');

  /* ---------- 命令表 ---------- */
  var CMDS = [
    { g: '页面', ic: '◉', label: '回到首页', kw: 'home home 首页 开始', run: function () { show('home'); } },
    { g: '页面', ic: '📄', label: '关于我', kw: 'about whoami 自我介绍 关于', run: function () { show('about'); } },
    { g: '页面', ic: '📁', label: '项目', kw: 'projects 项目 作品 splayer ciyuan', run: function () { show('projects'); } },
    { g: '页面', ic: '📝', label: '工作日志', kw: 'log 日志 blog', run: function () { show('log'); openDrawer(); } },
    { g: '页面', ic: '📮', label: '联络', kw: 'contact 联络 邮箱 email', run: function () { show('contact'); } },
    { g: '动作', ic: '⧉', label: '复制邮箱 contact@ciallo.sale', kw: 'copy email 复制 邮箱', run: function () {
        copyText('contact@ciallo.sale', '邮箱已复制 ✓');
      } },
    { g: '动作', ic: '⌘', label: '复制座右铭', kw: 'motto copy 座右铭', run: function () {
        copyText('No one can tell you what you can or cannot do.', '座右铭已复制 ✓');
      } },
    { g: '动作', ic: '↗', label: '打开 GitHub', kw: 'github 打开', run: function () {
        window.open('https://github.com/DelicateDuck582/', '_blank', 'noopener');
        toast('已在新标签打开 GitHub ↗');
      } },
    { g: '动作', ic: '◑', label: '切换浅色 / 深色', kw: 'theme light dark 主题 切换', run: function () {
        var b = document.body;
        var next = b.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.classList.add('theming');
        b.dataset.theme = next;
        var bg = getComputedStyle(b).getPropertyValue('--bg').trim();
        if (metaTheme && bg) metaTheme.setAttribute('content', bg);
        clearTimeout(themeTimer);
        themeTimer = setTimeout(function () { document.documentElement.classList.remove('theming'); }, 400);
        toast(next === 'light' ? '已切换到纸白主题' : '已切换到深色主题');
      } },
    { g: '彩蛋', ic: '⭐', label: 'Ciallo～', kw: 'ciallo 彩蛋 颜文字', run: function () { openCiallo(); } },
    { g: '彩蛋', ic: '🦆', label: 'quack', kw: 'duck quack 鸭 嘎', run: function () { toast('（๑´ㅂ`๑) quack～'); } }
  ];

  /* ---------- 面板 ---------- */
  var overlay = document.getElementById('overlay');
  var list = document.getElementById('list');
  var input = document.getElementById('q');
  var open = false, sel = 0, filtered = [];
  var paletteTimer = null;

  function render(q) {
    q = (q || '').trim().toLowerCase();
    filtered = CMDS.map(function (c) {
      var hay = (c.label + ' ' + c.kw).toLowerCase();
      var score = -1;
      if (!q) score = 0;
      else if (c.label.toLowerCase().indexOf(q) === 0) score = 2;
      else if (hay.indexOf(q) >= 0) score = 1;
      return { c: c, score: score };
    }).filter(function (x) { return x.score >= 0; })
      .sort(function (a, b) { return b.score - a.score; })
      .map(function (x) { return x.c; });

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">没有这个命令。' + esc(q) + ' —— 但没关系，无人能规定你该输入什么。</div>';
      return;
    }
    var html = '', lastG = null;
    filtered.forEach(function (c, i) {
      if (c.g !== lastG) { html += '<div class="group">' + c.g + '</div>'; lastG = c.g; }
      var label = esc(c.label);
      if (q) {
        var at = c.label.toLowerCase().indexOf(q);
        if (at >= 0) label = esc(c.label.slice(0, at)) + '<mark>' + esc(c.label.slice(at, at + q.length)) + '</mark>' + esc(c.label.slice(at + q.length));
      }
      var cin = Math.min(i * 12, 144);
      html += '<div class="cmd' + (i === sel ? ' sel' : '') + '" data-i="' + i + '" style="--cin:' + cin + 'ms">' +
              '<span class="ic">' + c.ic + '</span><span>' + label + '</span>' +
              '<span class="kbdhint"><kbd>↵</kbd></span></div>';
    });
    list.innerHTML = html;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function move(d) {
    if (!filtered.length) return;
    sel = (sel + d + filtered.length) % filtered.length;
    render(input.value);
    var el = list.querySelector('.cmd.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function exec(i) {
    var c = filtered[i];
    if (!c) return;
    closePalette();
    c.run();
  }
  function openPalette() {
    if (open) return;
    open = true; sel = 0;
    clearTimeout(paletteTimer);
    overlay.hidden = false;
    overlay.classList.remove('closing');
    input.value = '';
    render('');
    overlay.classList.add('on');
    setTimeout(function () { input.focus(); }, 0);
  }
  function closePalette() {
    if (!open) return;
    open = false;
    input.blur();
    overlay.classList.add('closing');
    clearTimeout(paletteTimer);
    paletteTimer = setTimeout(function () {
      overlay.classList.remove('on', 'closing');
      overlay.hidden = true;
    }, reduced ? 0 : 160);
  }
  input.addEventListener('input', function () { sel = 0; render(input.value); });
  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) closePalette(); });
  list.addEventListener('click', function (e) {
    var el = e.target.closest('.cmd');
    if (el) exec(parseInt(el.dataset.i, 10));
  });
  document.getElementById('kbdopen').addEventListener('click', openPalette);
  document.getElementById('mobileopen').addEventListener('click', openPalette);

  /* 键盘：全局拦截 */
  var MODIFIERS = { Shift: 1, Control: 1, Alt: 1, Meta: 1, CapsLock: 1, Tab: 1, Escape: 1 };
  document.addEventListener('keydown', function (e) {
    if (worklogOpen) return;
    if (cialloOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeCiallo(); }
      return;
    }
    if (!open) {
      if (e.key === 'Escape') return;
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault(); openPalette(); return;
      }
      if (MODIFIERS[e.key] || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
      /* 任意键唤起；字母键顺带作为快捷过滤 */
      e.preventDefault();
      openPalette();
      if (/^[a-z0-9]$/i.test(e.key)) { input.value = e.key; sel = 0; render(input.value); }
      return;
    }
    /* 面板内 */
    if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); exec(sel); }
  });

  /* ---------- worklog 全屏浮层：跳出框架 ---------- */
  var worklog = document.getElementById('worklog');
  var veil = document.getElementById('veil');
  var dframe = document.getElementById('dframe');
  var skeleton = document.getElementById('dskeleton');
  var wlClose = document.getElementById('dclose');
  var worklogOpen = false, frameRequested = false, frameReady = false, worklogTimer = null;

  function getFrameDoc() {
    try { return dframe.contentDocument || null; } catch (err) { return null; }
  }
  /* Pages 会把 /worklog.html 308 到 /worklog，两种形态都算工作日志页 */
  function isWorklogPath(pathname) {
    var p = String(pathname || '').replace(/\/+$/, '');
    return /\/worklog(\.html)?$/.test(p);
  }
  function frameIsWorklog() {
    try { return isWorklogPath(dframe.contentWindow.location.pathname); }
    catch (err) { return false; } /* 跨源读不到 location，按「不在 worklog」处理 */
  }
  /* iframe 每次导航都重跑：隐藏旧顶栏 + 捕获阶段拦截站内跳转（均幂等） */
  function guardFrameDoc(doc) {
    if (!doc) return;
    if (!doc.getElementById('wl-embed-style')) {
      var st = doc.createElement('style');
      st.id = 'wl-embed-style';
      st.textContent = 'header.topbar { display: none !important; }';
      (doc.head || doc.documentElement).appendChild(st);
    }
    if (doc.__wlGuard) return;
    doc.__wlGuard = true;
    doc.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#') return; /* 站内锚点放行 */
      var url;
      try { url = new URL(href, doc.baseURI); } catch (err) { return; }
      if (url.origin !== location.origin) return; /* 外链放行 */
      if (isWorklogPath(url.pathname)) return; /* 本页链接放行 */
      e.preventDefault();
      closeDrawer(); /* 浮层退场回指挥台，绝不把整站嵌进来 */
    }, true);
  }
  function resetFrame() {
    frameReady = false;
    dframe.classList.remove('ready');
    worklog.classList.remove('loaded');
    skeleton.hidden = false;
    skeleton.classList.remove('gone');
    dframe.src = 'worklog.html';
  }
  function onFrameLoad() {
    if (!frameRequested) return;
    var doc = getFrameDoc(), onWorklog = frameIsWorklog();
    if (doc && !onWorklog) { resetFrame(); return; } /* 保险层：404/站内导航不嵌套 */
    guardFrameDoc(doc);
    if (frameReady) return; /* 骨架收起只走首次；每次 load 只做防护 */
    frameReady = true;
    dframe.classList.add('ready');
    worklog.classList.add('loaded');
    skeleton.classList.add('gone');
    setTimeout(function () {
      if (frameReady) skeleton.hidden = true;
    }, reduced ? 0 : 320);
  }
  dframe.addEventListener('load', onFrameLoad);
  function openDrawer() {
    if (worklogOpen) return;
    if (open) closePalette();
    /* 保险层：关着时 iframe 被带去别处（含跨源），重开前拉回 worklog */
    if (frameRequested && !frameIsWorklog()) resetFrame();
    worklogOpen = true;
    clearTimeout(worklogTimer);
    worklog.hidden = false; veil.hidden = false;
    worklog.setAttribute('aria-hidden', 'false');
    if (!frameRequested) {
      frameRequested = true;
      skeleton.hidden = false;
      dframe.src = 'worklog.html';
    }
    if (frameReady) {
      skeleton.hidden = true;
      dframe.classList.add('ready');
      worklog.classList.add('loaded');
    } else {
      skeleton.hidden = false;
      skeleton.classList.remove('gone');
      dframe.classList.remove('ready');
      worklog.classList.remove('loaded');
    }
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      document.documentElement.classList.add('wlopen');
      veil.classList.add('on');
    }); });
    setTimeout(function () { if (worklogOpen) wlClose.focus(); }, reduced ? 0 : 560);
  }
  function closeDrawer() {
    if (!worklogOpen) return;
    worklogOpen = false;
    document.documentElement.classList.remove('wlopen');
    veil.classList.remove('on');
    if (worklog.contains(document.activeElement)) document.activeElement.blur();
    worklog.setAttribute('aria-hidden', 'true');
    clearTimeout(worklogTimer);
    worklogTimer = setTimeout(function () {
      worklog.hidden = true; veil.hidden = true;
    }, reduced ? 0 : 380);
  }
  wlClose.addEventListener('click', closeDrawer);
  veil.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && worklogOpen && !e.defaultPrevented) { e.preventDefault(); closeDrawer(); }
  });

  /* ---------- Ciallo 彩蛋浮层 ---------- */
  var ciallo = document.getElementById('ciallo');
  var cialloOpen = false, cialloTimer = null;

  function openCiallo() {
    if (cialloOpen) return;
    if (open) closePalette(); /* 面板让位，只留最上层 */
    if (worklogOpen) closeDrawer();
    cialloOpen = true;
    clearTimeout(cialloTimer);
    ciallo.hidden = false;
    ciallo.setAttribute('aria-hidden', 'false');
    /* 等 hidden 撤销生效再加 .on，否则过渡不会跑 */
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      if (cialloOpen) ciallo.classList.add('on');
    }); });
  }
  function closeCiallo() {
    if (!cialloOpen) return;
    cialloOpen = false;
    ciallo.classList.remove('on');
    ciallo.setAttribute('aria-hidden', 'true');
    clearTimeout(cialloTimer);
    cialloTimer = setTimeout(function () { ciallo.hidden = true; }, reduced ? 0 : 220);
  }
  ciallo.addEventListener('click', closeCiallo);

  /* ---------- toast / clipboard / 时钟 ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1900);
  }
  function copyText(text, ok) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok2 = false;
      try { ok2 = document.execCommand('copy'); } catch (err) {}
      ta.remove();
      toast(ok2 ? ok : '复制失败——手动抄一份吧：' + text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(ok); }, fallback);
    } else fallback();
  }
  var clockEl = document.getElementById('clock');
  function tick() {
    var d = new Date();
    clockEl.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  setInterval(tick, 1000); tick();
})();
</script>
