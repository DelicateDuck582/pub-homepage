# 工作日志：云端每天重建整页（提交节奏 / 分支拓扑 / 分支明细 / 提交时间线）
#
# 分工：Worker 负责「采集数据 + AI 逐条判类型 + 时间线快照」，这些都在 KV 里；
#       本工作流负责「把整页渲染出来」，四处统计与图都在这一步产出。
#       这样电脑不开机，图表也会每天自己更新；页面上还能看到当天新增的提交清单。
#
# 节奏：每天 21:30（北京）Worker 抓一次数据；数据有变化它立刻发 repository_dispatch 叫这里跑，
#       另外这里自己也有一份 21:40 的定时兜底（cron 用 UTC）。
#
# 需要准备：
#   1) 站点仓库根目录要有：index.html（模板）、_collect.py、_gen_worklog.py、inter-var.woff2、worklog.html（产物）
#   2) Secrets（都在这个仓库里配）：
#        WORKLOG_API              Worker 地址，例如 https://worklog-collector.xxx.workers.dev
#        WORKLOG_PUBLISH_TOKEN    Worker 的发布口令（写接口用）
#        SRC_TOKEN                可选：只读两个源仓库的 token；源仓库是公开的，不配也能跑（只是容易被限流）
name: worklog

on:
  schedule:
    - cron: '40 13 * * *'                # 每天 21:40 北京时间（Worker 21:30 抓完数据的兜底）
  workflow_dispatch:                     # 手动跑一次（页面上的「立即重建」链接也指到这里）
  repository_dispatch:                   # Worker 发现数据有变化时发这个事件，等于当天近实时
    types: [worklog-refresh]

permissions:
  contents: write                        # 只为了把新的 worklog.html 提交回本仓库

concurrency:
  group: worklog
  cancel-in-progress: false              # 上一次没跑完就排队，别互相覆盖

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 取出站点仓库
        uses: actions/checkout@v4

      - name: 拉两个源仓库的提交图（只取提交元数据，很快）
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          auth=""
          if [ -n "$SRC_TOKEN" ]; then auth="x-access-token:${SRC_TOKEN}@"; fi    # 公开仓库可以不带 token
          git clone --bare --filter=blob:none "https://${auth}github.com/DelicateDuck582/cloud-mail.git" cloud-mail.git
          git clone --bare --filter=blob:none "https://${auth}github.com/DelicateDuck582/SPlayer.git" SPlayer.git

      - name: 采集（原始时区、改动目录、分支分叉关系都算在本地这套口径里）
        run: python _collect.py

      - name: 取回类型判定（公开 GET，不需要口令）；有口令时顺带推数据并补判新提交
        env:
          API: ${{ secrets.WORKLOG_API }}
          TOKEN: ${{ secrets.WORKLOG_PUBLISH_TOKEN }}
        run: |
          # API 地址兜底：没配就用生成脚本里的默认值对应的那个 Worker
          api="${API:-https://worklog-collector.delicateduck582.workers.dev}"
          # /classify.json 是公开的 GET：先取一份，保证页面不会因为「没配 Secrets」而丢掉 AI 判定
          curl -fsS "$api/classify.json" -o worklog-kinds.json || true
          if [ -z "$TOKEN" ]; then
            echo '没配 WORKLOG_PUBLISH_TOKEN：跳过「推数据 + 补判新提交」，类型用上面取回的那份'
            exit 0
          fi
          # 先把这份数据推给 Worker（它顺手刷新 stage / dataHash / localData 与时间线快照），再让它补判新提交
          curl -fsS -X PUT "$api/publish/data.json" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @worklog-data.json > /dev/null || true
          curl -fsS -X POST "$api/classify?batches=6" -H "Authorization: Bearer $TOKEN" > /dev/null || true
          curl -fsS "$api/classify.json" -o worklog-kinds.json || true

      - name: 渲染整页（四处统计与图都在这一步产出）
        env:
          WORKLOG_API: ${{ secrets.WORKLOG_API }}
        run: python _gen_worklog.py

      - name: 判断页面真的变了没有（抹掉构建时间戳再比，避免每天白提一次）
        id: diff
        run: |
          norm() { sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+-][0-9]{2}:[0-9]{2}/<BUILD>/g' "$1"; }
          git show HEAD:worklog.html > _prev.html 2>/dev/null || : > _prev.html
          if diff -q <(norm _prev.html) <(norm worklog.html) > /dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '内容没变（只差构建时间戳），跳过提交与发布'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo '内容有变化，准备提交并发布'
          fi

      - name: 提交回仓库（Cloudflare Pages 会自动发布）
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worklog.html
          git commit -m "chore: 更新工作日志（$(date -u +%Y-%m-%dT%H:%MZ)）"
          git push

      - name: 把新页面推给 Worker（页面打开时会自动换成这一版）
        if: steps.diff.outputs.changed == 'true'
        env:
          API: ${{ secrets.WORKLOG_API }}
          TOKEN: ${{ secrets.WORKLOG_PUBLISH_TOKEN }}
        run: |
          api="${API:-https://worklog-collector.delicateduck582.workers.dev}"
          if [ -z "$TOKEN" ]; then
            echo '没配 WORKLOG_PUBLISH_TOKEN，跳过发布（页面已经提交进仓库，配好口令后下次会自动推）'
            exit 0
          fi
          curl -fsS -X PUT "$api/publish/page.html" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: text/html; charset=utf-8' \
            --data-binary @worklog.html > /dev/null
          curl -fsS -X PUT "$api/publish/data.json" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @worklog-data.json > /dev/null
          echo '已发布到 Worker'

